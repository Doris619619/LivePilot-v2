# 文件用途：匹配稳定版本标签后验证并发布 Windows 安装包到独立公开仓库。
name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.LIVENESTRELEASETOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livenest-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/build-manifest.json
